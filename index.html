<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location de films & séries</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header class="app-header py-4 mb-4">
    <div class="container">
      <h1 class="h2 mb-1">Location de films & séries</h1>
      <p class="mb-0 text-white-50">Les locations de nos spectateurs, reliées au catalogue.</p>
    </div>
  </header>

  <main class="container pb-5">
    <div id="error-zone" class="alert alert-danger d-none" role="alert"></div>

    <section id="indicators" class="row g-3 mb-4" aria-label="Indicateurs"></section>

    <section class="row g-2 mb-4 align-items-end">
      <div class="col-12 col-md-4">
        <label for="search-input" class="form-label">Nom du spectateur</label>
        <input id="search-input" type="search" class="form-control" placeholder="Ex : Nadia">
      </div>
      <div class="col-6 col-md-4">
        <label for="status-select" class="form-label">Statut de la location</label>
        <select id="status-select" class="form-select">
          <option value="all">Tous les statuts</option>
          <option value="Livree">Livree</option>
          <option value="En attente">En attente</option>
          <option value="Annulee">Annulee</option>
        </select>
      </div>
      <div class="col-6 col-md-4">
        <label for="category-select" class="form-label">Type de titre</label>
        <select id="category-select" class="form-select">
          <option value="all">Tous les types</option>
        </select>
      </div>
    </section>

    <section id="orders-container" class="row g-3" aria-label="Locations"></section>
  </main>

  <div class="modal fade" id="order-modal" tabindex="-1" aria-labelledby="order-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="order-modal-title">Détail de la location</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="order-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
